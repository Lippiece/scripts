on:
  push:
    tags:
      - 'v*'
jobs:
  build:
    runs-on: docker
    container:
      image: docker.io/oven/bun:latest
    steps:
      - uses: actions/checkout@v4
      - run: bun install
      - run: bun run build
      - uses: actions/forgejo-release@v2
        with:
          direction: upload
          release-dir: dist
